[project]
name = "compass"
version = "0.1.0"
description = "Compass: situation-aware AI consultant (Meta hackathon)"
requires-python = ">=3.13"
dependencies = [
    "websockets>=15",
    "cryptography>=44",
    "python-dotenv>=1",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langsmith>=0.14",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "click>=8.5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
